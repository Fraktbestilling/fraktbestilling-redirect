<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=https://karvo.no/">
  <link rel="canonical" href="https://karvo.no/">
  <title>Fraktbestilling er nå Karvo</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0D2137;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      text-align: center;
    }
    .card { max-width: 480px; }
    h1 {
      font-size: 32px;
      margin-bottom: 16px;
      color: #00B899;
    }
    p {
      font-size: 16px;
      line-height: 1.5;
      color: rgba(255,255,255,0.7);
      margin-bottom: 24px;
    }
    a {
      display: inline-block;
      background: #00B899;
      color: #0D2137;
      padding: 12px 24px;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Fraktbestilling er nå Karvo</h1>
    <p>Vi har flyttet til karvo.no. Du blir omdirigert automatisk.</p>
    <a href="https://karvo.no/">Gå til Karvo</a>
  </div>
  <script>
    // Bevar sti og query-parametere
    var target = 'https://karvo.no' + window.location.pathname + window.location.search + window.location.hash;
    window.location.replace(target);
  </script>
</body>
</html>
